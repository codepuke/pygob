[project]
name = "pygob"
version = "0.1.0"
description = "Pure-Python encoder and decoder for Go's gob binary serialization format"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dan Wolf", email = "dcwolf@gmail.com"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["gob", "go", "serialization", "binary", "encoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/codepuke/pygob"
Issues = "https://github.com/codepuke/pygob/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
